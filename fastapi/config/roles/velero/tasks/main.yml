---
# tasks file for velero
- name: Deploy Velero (first master only)
  run_once: true
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  environment:
    KUBECONFIG: "{{ KUBECONFIG_PATH }}"
  block:

    - name: Create Velero namespace
      kubernetes.core.k8s:
        name: "{{ VELERO_NAMESPACE }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ KUBECONFIG_PATH }}"
      #run_once: true

    - name: Create Kubernetes secret for Velero credentials
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ KUBECONFIG_PATH }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: minio-credentials
            namespace: "{{ VELERO_NAMESPACE }}"
          type: Opaque
          stringData:
            cloud: |
              [default]
              aws_access_key_id={{ MINIO_ROOT_USER }}
              aws_secret_access_key={{ MINIO_ROOT_PASSWORD }}
      no_log: true
      #run_once: true

    - name: Add Velero Helm repository
      kubernetes.core.helm_repository:
        name: vmware-tanzu
        repo_url: https://vmware-tanzu.github.io/helm-charts
        force_update: true
      #run_once: true

    - name: Deploy Velero via Helm
      kubernetes.core.helm:
        name: velero
        chart_ref: vmware-tanzu/velero
        chart_version: "{{ VELERO_CHART_VERSION }}"
        release_namespace: "{{ VELERO_NAMESPACE }}"
        kubeconfig: "{{ KUBECONFIG_PATH }}"
        state: present
        wait: true
        wait_timeout: 10m
        values:
          credentials:
            existingSecret: minio-credentials

          configuration:
            backupStorageLocation:
              name: default
              provider: aws
              bucket: "{{ BUCKET_NAME }}"
              default: true
              config:
                region: minio
                s3ForcePathStyle: true
                s3Url: "{{ MINIO_S3_URL }}"

          deployNodeAgent: true

          initContainers:
            - name: velero-plugin-for-aws
              image: "{{ VELERO_PLUGIN_AWS_IMAGE }}"
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - mountPath: /target
                  name: plugins
          
          schedules:
            daily:
              schedule: "{{ VELERO_SCHEDULE_CRON }}"
              template:
                ttl: "{{ VELERO_SCHEDULE_TTL }}"
                includedNamespaces: "{{ VELERO_BACKUP_NAMESPACES }}"
                defaultVolumesToFsBackup: true
      #run_once: true

    - name: Verify that the backup storage is accessible
      kubernetes.core.k8s_info:
        api_version: velero.io/v1
        kind: BackupStorageLocation
        name: default
        namespace: "{{ VELERO_NAMESPACE }}"
        kubeconfig: "{{ KUBECONFIG_PATH }}"
      register: velero_bsl
      until: velero_bsl.resources[0].status.phase | default('') == 'Available'
      retries: 12
      delay: 10
      #run_once: true

    - name: Display Velero status
      ansible.builtin.debug:
        msg:
          - "Velero deployed in namespace {{ VELERO_NAMESPACE }}"
          - "Storage: {{ velero_bsl.resources[0].status.phase }} on {{ BUCKET_NAME }}"
          - "Daily backup: {{ VELERO_SCHEDULE_CRON }}, retention {{ VELERO_SCHEDULE_TTL }}"
      #run_once: true
