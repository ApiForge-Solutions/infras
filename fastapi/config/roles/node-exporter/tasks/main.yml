# roles/node-exporter/tasks/main.yml
---
- name: Install node_exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    #lock_timeout: 300
    update_cache: true

- name: Enable and start it
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: started
    enabled: true