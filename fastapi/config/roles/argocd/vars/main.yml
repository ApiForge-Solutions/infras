---
# vars file for argocd

# Version du chart Helm argo/argo-cd. A verifier : helm search repo argo/argo-cd
ARGOCD_CHART_VERSION: "7.7.11"
ARGOCD_DOMAIN_NAME: "argocd.{{ TERRAFORM_APP_DOMAIN }}"

ARGOCD_CLUSTER_ISSUER: letsencrypt-prod

ARGOCD_USE_ALLOWLIST: true
TRAEFIK_ALLOWLIST_MIDDLEWARE: "traefik-allowlist@kubernetescrd"

ARGOCD_DEPLOY_APPS: false

ARGOCD_REPO_URL: "https://github.com/ApiForge-Solutions/infras.git"
ARGOCD_REPO_REVISION: "dev"          # branche qui contient fastapi/app/envs/
ARGOCD_CHART_PATH: "fastapi/app"

ARGOCD_ENVIRONMENTS:
  - { name: fastapi-dev,     namespace: fastapi-dev,     values_file: envs/values-dev.yaml,     auto_sync: true }
  - { name: fastapi-staging, namespace: fastapi-staging, values_file: envs/values-staging.yaml, auto_sync: true }
  - { name: fastapi-qa,      namespace: fastapi-qa,      values_file: envs/values-qa.yaml,      auto_sync: true }
  - { name: fastapi-prod,    namespace: fastapi-prod,    values_file: envs/values-prod.yaml,    auto_sync: false }
