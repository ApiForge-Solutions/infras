# roles/minio/tasks/main.yml
---
- name: Create the minio system user
  ansible.builtin.user:
    name: minio-user
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ MINIO_DATA_DIR }}"
    state: directory
    owner: minio-user
    group: minio-user
    mode: '0750'

- name: Download the MinIO server binary
  ansible.builtin.get_url:
    url: "{{ MINIO_BINARY_URL }}"
    dest: /usr/local/bin/minio
    mode: '0755'

- name: Download the mc client
  ansible.builtin.get_url:
    url: "{{ MC_BINARY_URL }}"
    dest: /usr/local/bin/mc
    mode: '0755'

- name: Write the MinIO environment file
  ansible.builtin.copy:
    dest: /etc/default/minio
    owner: root
    group: minio-user
    mode: '0640'
    content: |
      MINIO_ROOT_USER={{ MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD={{ MINIO_ROOT_PASSWORD }}
      MINIO_VOLUMES={{ MINIO_DATA_DIR }}
      MINIO_OPTS="--address :{{ MINIO_API_PORT }} --console-address :{{ MINIO_CONSOLE_PORT }}"
      MINIO_PROMETHEUS_AUTH_TYPE=public
  no_log: true
  notify: restart minio

- name: Install the systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/minio.service
    mode: '0644'
    content: |
      [Unit]
      Description=MinIO
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=minio-user
      Group=minio-user
      EnvironmentFile=/etc/default/minio
      ExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
      Restart=always
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
  notify: restart minio

- name: Start and enable MinIO
  ansible.builtin.systemd:
    name: minio
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the S3 port
  ansible.builtin.wait_for:
    port: "{{ MINIO_API_PORT }}"
    timeout: 60

- name: Write the Velero policy
  ansible.builtin.copy:
    dest: /etc/minio-velero-policy.json
    mode: '0600'
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject",
                       "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
            "Resource": ["arn:aws:s3:::{{ BUCKET_NAME }}/*"]
          },
          {
            "Effect": "Allow",
            "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
            "Resource": ["arn:aws:s3:::{{ BUCKET_NAME }}"]
          }
        ]
      }

