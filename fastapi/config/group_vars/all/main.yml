# DOCKER VARS
DOCKER_KEYRING_PATH: /etc/apt/keyrings/
DOCKER_KEYRING_FILENAME: docker.asc

DOCKER_SIGNING_KEY: "https://download.docker.com/linux/ubuntu/gpg"
DOCKER_REPO_URL: "https://download.docker.com/linux/ubuntu"

# KUBERNETES VARS
KUBERNETES_VERSION: "v1.29"
KUBERNETES_SIGNING_KEY: "https://pkgs.k8s.io/core:/stable:/{{ KUBERNETES_VERSION }}/deb/Release.key"
KUBERNETES_KEYRING_PATH: /etc/apt/keyrings/
KUBERNETES_KEYRING_FILENAME: "kubernetes-apt-keyring-{{ KUBERNETES_VERSION }}.gpg"
KUBECONFIG_PATH: /etc/kubernetes/admin.conf
KUBERNETES_PY_SPEC: "kubernetes<32"

K8S_REPO_URL: "https://pkgs.k8s.io/core:/stable:/{{ KUBERNETES_VERSION }}/deb/"

CALICO_REPO: "https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml"

# NETWORK VARS
PROXMOX_PUBLIC_IP: 151.115.96.129          # Get from Terraform ?
PROXMOX_PUBLIC_IFACE: vmbr0                # Get from Terraform ?

K8S_API_ENDPOINT: k8s-api.internal

K8S_API_VIP: 10.10.10.99                                      # kube-vip vars
KUBE_VIP_VERSION: v1.2.4                                      # kube-vip vars
KUBE_VIP_INIT_KUBECONFIG: /etc/kubernetes/super-admin.conf    # kube-vip vars

METALLB_IP_RANGE: "10.10.10.200-10.10.10.210"    # metallb IPs pool
TRAEFIK_LB_IP: 10.10.10.200                      # traefik IP

TERRAFORM_APP_DOMAIN: apiforge.cloud-ip.cc  # Get it from terraform


# CERT-MANAGER VARS
CERT_MANAGER_ACME_EMAIL: "apiforgesolutions@gmx.fr"
# STORAGE VARS
MINIO_NAMESPACE: "velero"
# MONITORING VARS
STORAGE_CLASS: local-path
GRAFANA_DOMAIN_NAME: "grafana.{{ TERRAFORM_APP_DOMAIN }}"
# CD VARS
ARGOCD_NAMESPACE: "argocd"

# MINIO VARS
MINIO_S3_URL: "http://{{ hostvars['minio_server'].ansible_host }}:9000"
BUCKET_NAME: velero-backup

ansible_python_interpreter: /usr/bin/python3

ALLOWED_SOURCE_RANGES:
  - "0.0.0.0/0"       # SECURITY RISK
  - "10.10.10.0/24"


# ALERT VARS
ALERT_EMAIL_TO: "apiforgesolutions@gmx.fr"        # receiver
ALERT_SMTP_HOST: mail.gmx.net
ALERT_SMTP_PORT: 587
ALERT_SMTP_FROM: "apiforgesolutions@gmx.fr"       
ALERT_SMTP_USER: "apiforgesolutions@gmx.fr"