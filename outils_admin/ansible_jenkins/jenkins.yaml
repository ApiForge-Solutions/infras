---
- name: Installer et configurer Jenkins
  hosts: jenkins
  become: true

  vars:
    jenkins_home: /var/lib/jenkins
    casc_dir: /var/lib/jenkins/casc_configs

    jenkins_plugins:
      # Plugins recommandés Jenkins
      - ant
      - antisamy-markup-formatter
      - build-timeout
      - cloudbees-folder
      - credentials-binding
      - email-ext
      - git
      - github-branch-source
      - gradle
      - ldap
      - mailer
      - matrix-auth
      - pam-auth
      - pipeline-stage-view
      - ssh-slaves
      - subversion
      - timestamper
      - workflow-aggregator
      - ws-cleanup
      - configuration-as-code
      - blueocean

  tasks:


    - name: Maj ubuntu
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Maj ubuntu
      ansible.builtin.apt:
        upgrade: dist


    - name: Installer les packages
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jre
          - curl
        state: present

    - name: Créer le dossier des clés APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Supprimer ancienne configuration du dépôt Jenkins
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/jenkins.list
        state: absent

    - name: Supprimer ancienne clé Jenkins
      ansible.builtin.file:
        path: /usr/share/keyrings/jenkins-keyring.asc
        state: absent

    - name: Télécharger la clé Jenkins
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Ajouter le dépôt Jenkins
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: true



    - name: Installation  Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present

    - name: arreter jenkins
      ansible.builtin.systemd:
        name: jenkins
        state: stopped

  

    - name: Telecharger jenskins
      ansible.builtin.get_url:
        url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.15.0/jenkins-plugin-manager-2.15.0.jar
        dest: /usr/local/bin/jenkins-plugin-manager.jar
        owner: root
        group: root
        mode: "0644"

    - name: Installer plugins jenkins
      ansible.builtin.command:
        cmd: >
          java -jar /usr/local/bin/jenkins-plugin-manager.jar
          --war /usr/share/java/jenkins.war
          --plugin-download-directory {{ jenkins_home }}/plugins
          --plugins {{ jenkins_plugins | join(' ') }}

    - name: Droit jenkins
      ansible.builtin.file:
        path: "{{ jenkins_home }}/plugins"
        owner: jenkins
        group: jenkins
        recurse: true


    - name: Créer le dossier JCasC
      ansible.builtin.file:
        path: "{{ casc_dir }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Créer la configuration Jenkins JCasC
      ansible.builtin.template:
        src: jenkins.yaml.j2
        dest: "{{ casc_dir }}/jenkins.yaml"
        owner: jenkins
        group: jenkins
        mode: "0600"

    

    - name: Créer le dossier systemd Jenkins
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configurer JCasC dans systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment="CASC_JENKINS_CONFIG={{ casc_dir }}/jenkins.yaml"


    - name: restart jeknins
      ansible.builtin.systemd:
        name: jenkins
        state: restarted
        enabled: true
        daemon_reload: true

 
    - name: Port jenkins 8080
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        delay: 5
        timeout: 120