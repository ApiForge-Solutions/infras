---
# tasks file for metallb
---
- name: Créer le namespace metallb-system
  kubernetes.core.k8s:
    name: "{{ metallb_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Ajouter le dépôt Helm MetalLB
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: https://metallb.github.io/metallb

- name: Déployer MetalLB via Helm
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    release_namespace: "{{ metallb_namespace }}"
    version: "0.14.3" 
    wait: true

- name: Configurer le pool d'adresses IP (IPAddressPool)
  kubernetes.core.k8s:
    state: present
    namespace: "{{ metallb_namespace }}"
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: default-pool
        namespace: "{{ metallb_namespace }}"
      spec:
        addresses:
          - "{{ metallb_ip_range }}"

- name: Activer l'annonce de niveau 2 (L2Advertisement)
  kubernetes.core.k8s:
    state: present
    namespace: "{{ metallb_namespace }}"
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: default-l2
        namespace: "{{ metallb_namespace }}"
      spec:
        ipAddressPools:
          - default-pool