---
- name: Deploy MetalLB (first master only)
  run_once: true
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  environment:
    KUBECONFIG: "{{ KUBECONFIG_PATH }}"
  block:
    - name: Add MetalLB Helm repository
      kubernetes.core.helm_repository:
        name: metallb
        repo_url: "{{ METALLB_REPO_URL }}"

    - name: Deploy MetalLB via Helm
      kubernetes.core.helm:
        name: metallb
        chart_ref: metallb/metallb
        chart_version: "{{ METALLB_VERSION }}"
        release_namespace: "{{ METALLB_NAMESPACE }}"
        create_namespace: true
        wait: true
        kubeconfig: "{{ KUBECONFIG_PATH }}"

    - name: Configure IPAddressPool
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ KUBECONFIG_PATH }}"
        definition:
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default-pool
            namespace: "{{ METALLB_NAMESPACE }}"
          spec:
            addresses:
              - "{{ METALLB_IP_RANGE }}"
      register: pool_result
      retries: 5
      delay: 10
      until: pool_result is succeeded

    - name: Enable L2Advertisement
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ KUBECONFIG_PATH }}"
        definition:
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default-l2
            namespace: "{{ METALLB_NAMESPACE }}"
          spec:
            ipAddressPools:
              - default-pool
