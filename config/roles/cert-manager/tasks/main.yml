---
# tasks file for cert-manager

# Config Ansible Controler config

- name: Install Python pip3 if necessary on Anisble controler
  ansible.builtin.package:
    name: python3-pip
    state: present
  delegate_to: localhost
  become: true

- name: Install Python Venv on Ansible controler
  ansible.builtin.package:
    name: python3-venv
    state: present
  delegate_to: localhost

- name: Create Python Virtual Environment and Install Kubernetes SDK ( Ubuntu >= 24.04 )
  ansible.builtin.pip:
    name:
      - kubernetes
      - PyYAML
    virtualenv: "{{ PYTHON_VENV_PATH }}"
    virtualenv_command: python3 -m venv
    state: present

# Install Cert-Manager

- name: Add cert-manager Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    url: https://charts.jetstack.io
    force_update: true

- name: Install cert-manager Helm chart with the CRDs
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: cert-manager
    create_namespace: true
    state: present
    set:
      installCRDs: true