---
# tasks file for cert-manager

- name: Add cert-manager Helm repo
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

- name: Deploy cert-manager via Helm
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: cert-manager
    create_namespace: true
    kubeconfig: /home/ubuntu/.kube/config
    values:
      installCRDs: true

- name: Wait for cert-manager webhook to be ready
  ansible.builtin.command: kubectl wait --for=condition=Available deployment/cert-manager-webhook -n cert-manager --timeout=120s
  changed_when: false

- name: Apply ClusterIssuer
  kubernetes.core.k8s:
    state: present
    src: /tmp/clusterissuer.yaml
    kubeconfig: /home/ubuntu/.kube/config