---
- name: Check if Kubernetes is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_init_check

- name: VIP must not answer on the network yet
  ansible.builtin.command: ping -c 2 -W 1 {{ K8S_API_VIP }}
  register: vip_ping
  failed_when: vip_ping.rc == 0
  changed_when: false
  when: not k8s_init_check.stat.exists

- name: Pre-pull the kube-vip image
  ansible.builtin.command: crictl pull ghcr.io/kube-vip/kube-vip:{{ KUBE_VIP_VERSION }}
  changed_when: false
  when: not k8s_init_check.stat.exists

- name: Place kube-vip manifest (init kubeconfig)
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    mode: '0600'
  vars:
    kube_vip_kubeconfig: "{{ KUBE_VIP_INIT_KUBECONFIG }}"
  when: not k8s_init_check.stat.exists

- name: kubeadm init with diagnostics
  block:
    - name: kubeadm init
      ansible.builtin.command: >
        kubeadm init
        --control-plane-endpoint={{ K8S_API_ENDPOINT }}:6443
        --upload-certs
        --apiserver-advertise-address={{ ansible_facts['default_ipv4']['address'] }}
        --apiserver-cert-extra-sans={{ K8S_API_VIP }},{{ ansible_facts['default_ipv4']['address'] }}
        --node-name={{ ansible_facts['hostname'] }}
        --pod-network-cidr=192.168.0.0/16
        --ignore-preflight-errors=DirAvailable--etc-kubernetes-manifests
      args:
        creates: /etc/kubernetes/admin.conf
  rescue:
    - name: Collect kube-vip and kubelet diagnostics
      ansible.builtin.shell: |
        EP=unix:///run/containerd/containerd.sock
        crictl --runtime-endpoint $EP ps -a | grep -E 'kube-vip|apiserver|etcd'
        for c in $(crictl --runtime-endpoint $EP ps -a --name kube-vip -q | head -1); do
          crictl --runtime-endpoint $EP logs --tail 40 $c 2>&1
        done
        journalctl -u kubelet -n 30 --no-pager | grep -i -E 'kube-vip|error'
        ip -4 addr show
      register: diag
      changed_when: false
      failed_when: false

    - name: Show diagnostics
      ansible.builtin.debug:
        var: diag.stdout_lines

    - name: Stop the play
      ansible.builtin.fail:
        msg: "kubeadm init failed on {{ inventory_hostname }}, see diagnostics above

- name: Switch kube-vip to admin.conf
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    mode: '0600'
  vars:
    kube_vip_kubeconfig: "{{ KUBECONFIG_PATH }}"

- name: Wait for the API through the VIP
  ansible.builtin.wait_for:
    host: "{{ K8S_API_VIP }}"
    port: 6443
    timeout: 120

- name: Create .kube directory for user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy admin.conf to user's kubeconfig
  ansible.builtin.copy:
    src:  "{{ KUBECONFIG_PATH }}"
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Install Calico pod network
  ansible.builtin.command: kubectl apply -f {{ CALICO_REPO }}
  environment:
    KUBECONFIG: "{{ KUBECONFIG_PATH }}"
  changed_when: false

- name: Create join token
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: Upload control-plane certs
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: cert_out
  changed_when: false

- name: Store join command as a fact
  ansible.builtin.set_fact:
    control_plane_join: "{{ join_cmd.stdout }} --control-plane --certificate-key {{ cert_out.stdout_lines | last }}"
