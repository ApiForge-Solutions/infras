---
- name: Control-plane init on primary master
  ansible.builtin.import_tasks: init.yml
  when: inventory_hostname == groups['k8s-masters'][0]

- name: Control-plane join (secondary masters)
  ansible.builtin.import_tasks: join.yml
  when: inventory_hostname != groups['k8s-masters'][0]
