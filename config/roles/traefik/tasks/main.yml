# roles/traefik/tasks/main.yml
#SPDX-License-Identifier: MIT-0
---
# tasks file for traefik

- name: Create traefik namespace
  kubernetes.core.k8s:
    name: traefik
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Add Traefik Helm repo
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: https://traefik.github.io/charts

- name: Render Traefik Helm values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /tmp/traefik-values.yaml
  vars:
    dashboard_user: "{{ vault_dashboard_user }}"
    dashboard_password: "{{ vault_dashboard_password }}"
    app_domain: "{{ terraform_app_domain }}"

- name: Request TLS certificate for the Traefik dashboard
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: dashboard-tls
        namespace: traefik
      spec:
        secretName: dashboard-tls
        dnsNames:
          - "dashboard.{{ terraform_app_domain }}"
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer

- name: Deploy Traefik via Helm
  kubernetes.core.helm:
    name: traefik
    chart_ref: traefik/traefik
    release_namespace: traefik
    create_namespace: true
    values_files:
      - /tmp/traefik-values.yaml
    kubeconfig: "{{ kubeconfig_path }}"

- name: Wait for Traefik deployment to be available
  ansible.builtin.command: >
    kubectl wait --for=condition=Available deployment/traefik
    -n traefik --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false