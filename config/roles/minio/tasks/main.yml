---
# tasks file for minio
---
- name: Créer le namespace pour MinIO et Velero
  kubernetes.core.k8s:
    name: "{{ MINIO_NAMESPACE }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Ajouter le dépôt Helm Bitnami
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami

- name: Déployer MinIO via Helm
  kubernetes.core.helm:
    name: minio
    chart_ref: bitnami/minio
    release_namespace: "{{ MINIO_NAMESPACE }}"
    values:
      auth:
        rootUser: "{{ MINIO_ROOT_USER }}"
        rootPassword: "{{ MINIO_ROOT_PASSWORD }}"
      defaultBuckets: "velero-backup"
