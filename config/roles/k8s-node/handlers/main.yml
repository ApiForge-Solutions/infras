---
# handlers file for k8s-node

- name: docker status
  ansible.builtin.service:
    name: docker
    state: started

- name: restart and enable containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: yes

- name: restart kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
    daemon_reload: true