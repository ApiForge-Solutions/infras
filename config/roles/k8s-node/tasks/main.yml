---
# tasks file for k8s-node
##### Install Docker and its dependent components.

- hosts: k8s-nodes
  become: true
  tasks:
  - name: Install packages that allow apt to be used over HTTPS
    ansible.builtin.apt:
      name: "{{ packages }}"
      state: present
      update_cache: yes
    vars:
      packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common

  - name: Add an apt signing key for Docker
    ansible.builtin.apt_key:
      url: https://download.docker.com/linux/ubuntu/gpg
      state: present

  - name: Add apt repository for stable version
    ansible.builtin.apt_repository:
      repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu xenial stable
      state: present

  - name: Install docker and its dependecies
    ansible.builtin.apt: 
      name: "{{ packages }}"
      state: present
      update_cache: yes
    vars:
      packages:
      - docker-ce 
      - docker-ce-cli 
      - containerd.io
    notify:
      - docker status

  - name: Add user to docker group
    ansible.builtin.user:
      name: "{{ USER }}"
      group: docker

### Disable swap.

  - name: Create directory for Kubernetes apt keyrings
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'

  - name: Add Kubernetes apt signing key
    ansible.builtin.get_url:
      url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
      dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
      mode: '0644'

  - name: Add Kubernetes apt repository
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/kubernetes.list
      content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"

  - name: Install Kubernetes binaries
    ansible.builtin.apt: 
      name: "{{ packages }}"
      state: present
      update_cache: yes
    vars:
      packages:
        - kubelet 
        - kubeadm 
        - kubectl

  - name: Configure node ip
    ansible.builtin.lineinfile:
      path: /etc/default/kubelet
      line: KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}

  - name: Restart kubelet
    ansible.builtin.service:
      name: kubelet
      daemon_reload: yes
      state: restarted

### Initialize the Kubernetes cluster.

  - name: Initialize the Kubernetes cluster using kubeadm
    ansible.builtin.command: kubeadm init --apiserver-advertise-address="192.168.50.10" --apiserver-cert-extra-sans="192.168.50.10" --node-name k8s-master --pod-network-cidr=192.168.0.0/16

### Join the nodes to the Kubernetes cluster.

  - name: Copy the join command to server location
    ansible.builtin.copy: src=join-command dest=/tmp/join-command.sh mode=0777

  - name: Join the node to cluster
    ansible.builtin.command: sh /tmp/join-command.sh
