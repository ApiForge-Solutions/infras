---
# tasks file for helm

- name: Download Helm command line tool
  ansible.builtin.uri:
    url: "{{ HELM_REPO }}"
    return_content: true
  register: helm_install

- name: Install Helm
  ansible.builtin.command:
    cmd: bash
    stdin: "{{ helm_install.content }}"
    creates: /usr/local/bin/helm                                              
  environment:
    DESIRED_VERSION: "{{ helm_version | default('') }}"
