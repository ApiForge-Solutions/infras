- name: Kubernetes global config
  hosts: k8s_global
  become: true
  roles:
    - k8s

- name: Kubernetes masters config
  hosts: k8s_masters
  become: true
  roles:
    - k8s-master
    - helm
#    - metallb
#    - cert-manager
#    - traefik

- name: Kubernetes workers config
  hosts: k8s_workers
  become: true
  roles:
    - k8s-worker
