# roles/traefik/tasks/main.yml
#SPDX-License-Identifier: MIT-0
---
# tasks file for traefik

- name: Deploy Traefik (first master only)
  run_once: true
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  environment:
    KUBECONFIG: "{{ KUBECONFIG_PATH }}"
  block:

    - name: Create traefik namespace
      kubernetes.core.k8s:
        name: "{{ TRAEFIK_NAMESPACE }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ KUBECONFIG_PATH }}"

    - name: Add Traefik Helm repo
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: https://traefik.github.io/charts

    - name: Render Traefik Helm values
      ansible.builtin.template:
        src: traefik-values.yml.j2
        dest: /tmp/traefik-values.yml
        mode: '0600'
      no_log: true
      vars:
        dashboard_user: "{{ VAULT_DASHBOARD_USER }}"
        dashboard_password: "{{ VAULT_DASHBOARD_PASSWORD }}"
        app_domain: "{{ TERRAFORM_APP_DOMAIN }}"

################# Start CoreDNS steps

    - name: Read the CoreDNS ConfigMap
      kubernetes.core.k8s_info:
        kubeconfig: "{{ KUBECONFIG_PATH }}"
        kind: ConfigMap
        name: coredns
        namespace: kube-system
      register: coredns_cm

    - name: Check the Corefile has the expected layout
      ansible.builtin.assert:
        that: "'    forward .' in coredns_cm.resources[0].data.Corefile"
        fail_msg: "Unexpected Corefile layout, edit the ConfigMap by hand"
        quiet: true

    - name: Add the app hostnames to CoreDNS
      kubernetes.core.k8s:
        kubeconfig: "{{ KUBECONFIG_PATH }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: coredns
            namespace: kube-system
          data:
            Corefile: "{{ coredns_cm.resources[0].data.Corefile.replace('    forward .', hosts_block ~ '    forward .', 1) }}"
      vars:
        hosts_block: |2
              hosts {
                 {{ TRAEFIK_LB_IP }} traefik.{{ TERRAFORM_APP_DOMAIN }}                                                                        # ADD URL HERE
                 {{ TRAEFIK_LB_IP }} test.{{ TERRAFORM_APP_DOMAIN }}
                 fallthrough
              }
      register: coredns_patch
      when: ("traefik." ~ TERRAFORM_APP_DOMAIN) not in coredns_cm.resources[0].data.Corefile

    - name: Restart CoreDNS to apply it now
      ansible.builtin.command: kubectl -n kube-system rollout restart deploy/coredns
      when: coredns_patch is changed

################## end CoreDNS steps

    - name: Request TLS certificate for the Traefik dashboard
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ KUBECONFIG_PATH }}"
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: dashboard-tls
            namespace: "{{ TRAEFIK_NAMESPACE }}"
          spec:
            secretName: dashboard-tls
            dnsNames:
              - "traefik.{{ TERRAFORM_APP_DOMAIN }}"
            issuerRef:
              name: "{{ LETSENCRYPT_ISSUER }}"
              kind: ClusterIssuer

    - name: Deploy Traefik via Helm
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        release_namespace: "{{ TRAEFIK_NAMESPACE }}"
        create_namespace: true
        chart_version: "{{ TRAEFIK_CHART_VERSION }}"
        values_files:
          - /tmp/traefik-values.yml
        wait: true
        kubeconfig: "{{ KUBECONFIG_PATH }}"
      no_log: true # for security

    - name: Remove rendered values for security
      ansible.builtin.file:
        path: /tmp/traefik-values.yml
        state: absent
